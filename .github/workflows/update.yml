name: อัปเดตผลหวยลาว

on:
  schedule:
    # 22:00 เวลาไทย (UTC+7) ทุกวัน — หลังหวยออก
    # หมายเหตุ: GitHub มักเริ่มรอบตั้งเวลาช้ากว่ากำหนด 2-7 ชม. (จริงๆ รันราวตี 1-5) ไม่กระทบข้อมูล
    - cron: '0 15 * * *'
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write
  issues: write             # ใช้เปิด issue แจ้งเตือนเวลาพัง

concurrency:
  group: update-lao
  cancel-in-progress: false

env:
  ALERT_FILE: alerts.md     # สคริปต์จดปัญหาที่คนต้องตรวจลงไฟล์นี้ (ไม่ถูก commit)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ติดตั้ง dependency
        run: pip install openpyxl

      - name: ดึงผลหวยลาวล่าสุด
        run: python tools/fetch_history.py

      - name: ดึงผลหวยฮานอยล่าสุด
        run: python tools/fetch_hanoi.py

      # ด่านสุดท้าย: งวดหาย / เลขผิดรูปแบบ → หยุด ไม่ commit
      - name: ตรวจข้อมูลก่อนบันทึก
        run: python tools/check_data.py

      - name: commit + push ถ้ามีงวดใหม่
        run: |
          if git diff --quiet -- lao_history.json hanoi_history.json; then
            echo "ไม่มีงวดใหม่ — ข้าม"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lao_history.js lao_history.json lao_history.csv lao_history.xlsx \
                    hanoi_history.js hanoi_history.json hanoi_history.csv hanoi_history.xlsx
            git commit -m "อัปเดตผลหวยลาว+ฮานอยอัตโนมัติ $(date -u +%Y-%m-%d)"
            git push
          fi

      # ตรวจว่าข้อมูลยังสดอยู่ไหม — จับกรณี "รันผ่านแต่ข้อมูลไม่มา" (พังเงียบ)
      - name: ตรวจความสดของข้อมูล
        id: fresh
        run: python tools/check_fresh.py

      # แหล่งข้อมูลให้เลขไม่ตรงกัน (ระบบไม่เดา ไม่ทับ) → ให้คนตรวจ
      - name: ตรวจว่ามีงวดที่แหล่งข้อมูลขัดกันไหม
        run: |
          if [ -s "$ALERT_FILE" ]; then
            cat "$ALERT_FILE"
            exit 1
          fi

      # ถ้าขั้นตอนไหนล้ม → เปิด issue แจ้งเตือน (GitHub จะส่งอีเมลให้เจ้าของ repo)
      - name: แจ้งเตือนเมื่อพัง
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STALE: ${{ steps.fresh.outputs.stale }}
        run: |
          DETAIL=""
          [ -s "$ALERT_FILE" ] && DETAIL="$(cat "$ALERT_FILE")"
          TITLE="ระบบอัปเดตผลหวยมีปัญหา"
          BODY="ระบบอัปเดตอัตโนมัติต้องให้คนตรวจ ($(date -u +%Y-%m-%d))

          ${STALE:-}
          ${DETAIL:-ดึงข้อมูลหรือ push ไม่สำเร็จ}

          ดู log: ${RUN_URL}

          **ถ้าเป็นเรื่องแหล่งข้อมูลไม่ตรงกัน:** ระบบไม่บันทึก/ไม่ทับงวดนั้นไว้ก่อน
          เปิดดูผลจากเว็บอื่นแล้วแก้ไฟล์เอง หรือรอรอบหน้า (เว็บข่าวมักแก้คำผิดเองภายใน 1-2 วัน)

          **ถ้าข้อมูลค้าง:** หน้า Sanook ฮานอยเก็บย้อนหลังแค่ ~5 วัน
          กด Re-run ที่หน้า Actions — ถ้ายังพัง แปลว่าเว็บต้นทางเปลี่ยนรูปแบบ
          ต้องแก้ตัวอ่านใน tools/sources.py แล้วรัน fetch_*.py --full เพื่อเติมงวดที่ขาด"

          # ถ้ามี issue เดิมที่ยังเปิดอยู่ ให้คอมเมนต์ต่อ (กันสแปมวันละใบ)
          EXISTING=$(gh issue list --label "auto-update-failed" --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "คอมเมนต์ต่อใน issue #$EXISTING"
          else
            gh label create "auto-update-failed" --color B60205 --description "ระบบอัปเดตอัตโนมัติล้มเหลว" 2>/dev/null || true
            gh issue create --title "$TITLE" --label "auto-update-failed" --body "$BODY"
          fi
