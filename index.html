<body>
<div id="root"></div>
<!-- ประวัติผลหวยจริง (สร้างจาก tools/fetch_history.py + tools/fetch_hanoi.py) -->
<script src="lao_history.js"></script>
<script src="hanoi_history.js"></script>
<script>
"use strict";

/* ---------- tiny DOM helper ---------- */
function el(tag, opts, children){
  const node = document.createElement(tag);
  opts = opts || {};
  if(opts.style) Object.assign(node.style, opts.style);
  if(opts.class) node.className = opts.class;
  if(opts.onClick) node.addEventListener('click', opts.onClick);
  if(opts.onChange) node.addEventListener('change', opts.onChange);
  for(const k in opts){
    if(['style','class','onClick','onChange'].includes(k)) continue;
    if(k === 'html'){ node.innerHTML = opts[k]; continue; }
    node.setAttribute(k, opts[k]);
  }
  if(children != null){
    (Array.isArray(children) ? children : [children]).forEach(c=>{
      if(c == null || c === false) return;
      node.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    });
  }
  return node;
}

/* ============================================================
   เลขดี — วิเคราะห์ "หวยลาว/ฮานอย" จากสถิติย้อนหลัง (หน้าเดียว)
   ข้อมูลหลัก = lao_history / hanoi_history (GitHub Actions ดึง + ตรวจเทียบหลายแหล่งทุกคืน)
   ปุ่ม "อัปเดตผลจริง" โหลดข้อมูลชุดล่าสุดจาก GitHub + เติมงวดของวันนี้จากบ้านกีฬา (เก็บใน localStorage)
   ============================================================ */
const App = {
  state: {
    windowSize:30,
    dateFrom:'2025-01-01', dateTo:new Date().toISOString().slice(0,10),
    preset:'all', side:'top',
    openCal:null, calMonth:0,  // custom dd/mm/yyyy date picker
    view:'home',               // 'home' | 'analyze' | 'table' | 'backtest'
    lottery:'lao'              // หวยที่เลือก
  },
  theme:'pastel',

  /* หวยที่รองรับ (ลาว + ฮานอย 4 ประเภท) • src = แหล่งข้อมูลในตัว (ดู tools/sources.py) */
  LOTTERIES: [
    { id:'lao',          name:'หวยลาว',        hue:188, src:'Sanook + สยามรัฐ + ข่าวสด' },     // เทอร์ควอยซ์
    { id:'hanoi',        name:'ฮานอย',         hue:296, src:'ผลทางการ XSMB' },                 // ม่วง-แมเจนทา
    { id:'hanoiSpecial', name:'ฮานอยพิเศษ',    hue:242, src:'Sanook + สยามรัฐ + บ้านกีฬา' },   // อินดิโก
    { id:'hanoiVip',     name:'ฮานอย VIP',     hue:338, src:'Sanook + สยามรัฐ + บ้านกีฬา' },   // โรสพิงก์
    { id:'hanoiTask',    name:'ฮานอยเฉพาะกิจ', hue:215, src:'Sanook + สยามรัฐ + บ้านกีฬา' },   // ฟ้า-azure
  ],
  HANOI_KEYS: ['hanoi','hanoiSpecial','hanoiVip','hanoiTask'],
  lot(){ return this.LOTTERIES.find(x=>x.id===this.state.lottery) || this.LOTTERIES[0]; },
  TM: ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],

  /* live-update state */
  _mock:null, _real:null, _seed:null, lastUpd:null, updating:false, updateStatus:'', updateOk:null,

  setState(patch){ Object.assign(this.state, patch); render(); },
  selectLottery(id){ this.state.lottery=id; this.state.openCal=null; this.applyPreset('all'); },

  /* ---- mock สำรอง (เฉพาะลาว กรณีไม่มี seed) ---- */
  mul(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; },
  g(rng,c,s){ let v; if(rng()<0.12) v=Math.floor(rng()*100); else v=Math.round(c+(rng()+rng()+rng()-1.5)*s*1.35); return Math.max(0,Math.min(99,v)); },
  _ensure(){
    if(this._seed) return;
    const rng=this.mul(1011); const mock=[]; const start=new Date(2025,0,1), end=new Date();
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) mock.push({ts:d.getTime(),top:this.g(rng,46,13),bottom:this.g(rng,54,12)});
    this._mock=mock;
    this.loadSeed(); this.loadReal();
  },

  /* ---- ข้อมูลในตัว (seed) ต่อหวย ---- */
  loadSeed(){
    if(this._seed) return;
    const s={ lao: Array.isArray(window.LAO_HISTORY) ? window.LAO_HISTORY.slice() : [] };
    const H=window.HANOI_HISTORY||{};
    for(const k of this.HANOI_KEYS) s[k]=Array.isArray(H[k])?H[k].slice():[];
    this._seed=s;
  },

  /* ---- real data layer (localStorage) — เก็บแยกต่อหวย ---- */
  STORE_KEY:'legdee_real_v4',
  loadReal(){
    try{ const o=JSON.parse(localStorage.getItem(this.STORE_KEY)||'{}'); this._real=o.real||{}; this.lastUpd=o.lastUpd||{}; }
    catch(e){ this._real={}; this.lastUpd={}; }
  },
  saveReal(){ try{ localStorage.setItem(this.STORE_KEY, JSON.stringify({real:this._real,lastUpd:this.lastUpd})); }catch(e){} },
  ymd(ts){ const d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); },
  mergeReal(list, id){
    const cur=this._real[id]||[]; const byDay={};
    for(const d of cur) byDay[this.ymd(d.ts)]=d;
    for(const d of list) byDay[this.ymd(d.ts)]={ts:d.ts,top:d.top,bottom:d.bottom};
    this._real[id]=Object.values(byDay).sort((a,b)=>a.ts-b.ts);
  },
  isReal(id){ id=id||this.state.lottery; return ((this._seed[id]||[]).length>0)||((this._real[id]||[]).length>0); },
  draws(id){
    id=id||this.state.lottery;
    const seed=this._seed[id]||[], real=this._real[id]||[];
    if(!seed.length && !real.length) return id==='lao'? this._mock : [];
    const byDay={};
    for(const d of real) byDay[this.ymd(d.ts)]=d;
    // ข้อมูลในตัว (ตรวจเทียบหลายแหล่งแล้ว) ชนะผลที่กดดึงเองในเบราว์เซอร์ — ปุ่มอัปเดตใช้เติมเฉพาะงวดที่ยังไม่มี
    for(const d of seed) byDay[this.ymd(d.ts)]=d;
    return Object.values(byDay).sort((a,b)=>a.ts-b.ts);
  },

  /* ---- stats helpers ---- */
  pad(n){ return String(n).padStart(2,'0'); },
  thai(ts){ const x=new Date(ts); return x.getDate()+' '+this.TM[x.getMonth()]+' '+(x.getFullYear()+543); },
  short(ts){ const x=new Date(ts); return x.getDate()+' '+this.TM[x.getMonth()]; },
  cnt(draws,side){ const a=new Array(100).fill(0); for(let i=0;i<draws.length;i++) a[draws[i][side]]++; return a; },
  pre(a){ const p=new Array(101).fill(0); for(let i=0;i<100;i++) p[i+1]=p[i]+a[i]; return p; },
  cov(p,total,w){ let best={s:0,p:-1}; const pts=[]; const end=100-w; for(let s=0;s<=end;s++){ const c=p[s+w]-p[s]; const pr=total?c/total:0; pts.push(pr); if(pr>best.p) best={s,p:pr}; } return {pts,best}; },
  lab(s,w){ return this.pad(s)+'–'+this.pad(s+w-1); },
  pl(p){ return Math.round(p*100)+'%'; },
  /* ผลทำนายย้อนหลังเทียบการซื้อ size ตัวชุดไหนก็ได้ — ชุด size ตัวจาก 100 ตัว ไม่ว่าเลขชุดไหนก็ถูกราว size% อยู่แล้ว
     (ทดสอบกับข้อมูลจริงทั้ง 5 หวย ต.ค. 2569: วิธีเลือกช่วงจากสถิติถูก 30.6% เทียบ 30% — ไม่ต่างกัน) */
  verdict(hit, n, size){
    if(n<30) return {txt:'งวดน้อยเกินไปที่จะสรุป', tone:0};
    const p=size/100, z=(hit-n*p)/Math.sqrt(n*p*(1-p));
    if(z>=2)  return {txt:'สูงกว่าซื้อ '+size+' ตัวชุดไหนก็ได้เล็กน้อย แต่อาจเป็นความบังเอิญ', tone:1};
    if(z<=-2) return {txt:'ต่ำกว่าซื้อ '+size+' ตัวชุดไหนก็ได้', tone:-1};
    return {txt:'ไม่ต่างจากซื้อ '+size+' ตัวชุดไหนก็ได้', tone:0};
  },
  colorFor(hue){
    // design tokens (pastel): [L_accent,C_accent, L_deep,C_deep, L_soft,C_soft]
    const t=[0.72,0.12, 0.54,0.16, 0.965,0.03];
    return {
      accent:`oklch(${t[0]} ${t[1]} ${hue})`,
      deep:`oklch(${t[2]} ${t[3]} ${hue})`,
      soft:`oklch(${t[4]} ${t[5]} ${hue})`,
      hue
    };
  },
  dataRange(){ const a=this.draws(); return a.length ? {min:new Date(a[0].ts), max:new Date(a[a.length-1].ts)} : {min:new Date(2025,0,1), max:new Date()}; },
  _iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); },
  applyPreset(k){
    const {min,max}=this.dataRange(); let start;
    if(k==='all') start=min;
    else { const days=k==='6m'?180:k==='3m'?90:30; start=new Date(max.getTime()-days*86400000); if(start<min) start=min; }
    this.setState({ preset:k, dateFrom:this._iso(start), dateTo:this._iso(max) });
  },
  yearsInData(){ const {min,max}=this.dataRange(); const out=[]; for(let y=min.getFullYear(); y<=max.getFullYear(); y++) out.push(y); return out; },
  applyYear(ceYear){
    const {min,max}=this.dataRange();
    let start=new Date(ceYear,0,1), end=new Date(ceYear,11,31,23,59,59);
    if(start<min) start=min; if(end>max) end=max;
    this.setState({ preset:'year:'+ceYear, dateFrom:this._iso(start), dateTo:this._iso(end) });
  },
  clearFilters(){ this.state.windowSize=30; this.applyPreset('all'); },

  /* ---- backtest: ทำนายแต่ละงวดจากข้อมูลก่อนหน้า แล้วเทียบผลจริง ---- */
  backtest(size, fromTs, toTs, id){
    const all=this.draws(id); const rows=[]; let hitT=0,hitB=0,nT=0,nB=0;
    const ct=new Array(100).fill(0), cb=new Array(100).fill(0);
    for(let i=0;i<all.length;i++){
      const d=all[i];
      if(i>=20 && d.ts>=fromTs && d.ts<toTs){
        const aT=this.cov(this.pre(ct),i,size).best, aB=this.cov(this.pre(cb),i,size).best;
        const okT=d.top>=aT.s && d.top<aT.s+size, okB=d.bottom>=aB.s && d.bottom<aB.s+size;
        rows.push({ ts:d.ts, pTop:[aT.s,aT.s+size-1], aTop:d.top, okT, pBot:[aB.s,aB.s+size-1], aBot:d.bottom, okB });
        nT++; if(okT)hitT++; nB++; if(okB)hitB++;
      }
      ct[d.top]++; cb[d.bottom]++;
    }
    return { rows, accT:nT?hitT/nT:0, accB:nB?hitB/nB:0, hitT, hitB, nT, nB };
  },

  /* ---- ปุ่ม "อัปเดตผลจริง" (ไม่ใช้ CORS proxy แล้ว — proxy ฟรีที่เคยใช้ตายหมด) ----
     1) โหลดข้อมูลที่ระบบตรวจเทียบหลายเว็บแล้วชุดล่าสุดจาก GitHub (กันหน้าที่เปิดค้างไว้เห็นข้อมูลเก่า)
     2) เติมงวดที่ระบบรอบกลางคืนยังไม่ได้ดึง จากบ้านกีฬา — WordPress API ของเว็บนี้อนุญาตให้เว็บอื่นดึงตรงได้
        (ฮานอยลงผลราว 19:45 / ลาวราว 20:40) งวดพวกนี้มาจากเว็บเดียว ใช้เติมเฉพาะวันที่ยังไม่มี
        แล้วรอบกลางคืนจะแทนด้วยข้อมูลที่ตรวจเทียบแล้ว (draws() ให้ข้อมูลในตัวชนะเสมอ) */
  RAW_URL:'https://raw.githubusercontent.com/thitiphorn-data/lekdee-lao-lottery/main/',
  async getJSON(url){
    const ctrl=new AbortController(); const tid=setTimeout(()=>ctrl.abort(),12000);
    try{ const r=await fetch(url,{cache:'no-store',signal:ctrl.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
    finally{ clearTimeout(tid); }
  },
  async reloadData(bases){   // bases: '' = โฟลเดอร์เดียวกับหน้าเว็บ, RAW_URL = GitHub โดยตรง (ใช้ได้แม้เปิดจากไฟล์ในเครื่อง)
    for(const base of bases){
      try{
        const v='?v='+Date.now();
        const [lao,han]=await Promise.all([this.getJSON(base+'lao_history.json'+v), this.getJSON(base+'hanoi_history.json'+v)]);
        if(!Array.isArray(lao) || !lao.length || !han || typeof han!=='object' || !Object.keys(han).length) continue;
        window.LAO_HISTORY=lao; window.HANOI_HISTORY=han; this._seed=null;
        return true;
      }catch(e){}
    }
    return false;
  },
  findDate(t){   // '6/10/69', '5/10/2569', '6 ตุลาคม 2569', '6 ต.ค.2569' → UTC midnight
    const TM_FULL=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    let d,mo,y,m=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if(m){ d=+m[1]; mo=+m[2]; y=+m[3]; }
    else {
      m=t.match(/(\d{1,2})\s*([฀-๿.]+?)\s*(\d{4})/); if(!m) return null;
      const nm=m[2].replace(/\.$/,'');
      mo=1+this.TM.findIndex(x=>x.replace(/\.$/,'')===nm); if(!mo) mo=1+TM_FULL.indexOf(nm); if(!mo) return null;
      d=+m[1]; y=+m[3];
    }
    if(y<100) y+=2500; if(y>2400) y-=543;
    return Date.UTC(y,mo-1,d);
  },
  /* บทความ "ตรวจหวยลาว/ฮานอยวันนี้ งวดประจำวัน…" ของบ้านกีฬา → {lao:[…]} หรือ {hanoi:[…], hanoiSpecial:[…], …}
     กติกาตัดเลขเดียวกับ tools/sources.py — ลาว: บน = 2 ตัวท้ายของเลข 4 ตัว, ล่าง = 2 ตัวหน้า
     ฮานอย: บน = ท้ายรางวัลพิเศษ, ล่าง = ท้ายรางวัลที่ 1 (บทความเขียนเป็น 3 ตัวบน/2 ตัวบน/2 ตัวล่างให้แล้ว) */
  parseBankeela(posts, kind){
    const strip=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ');
    const typeKey=(n)=>{ n=n.trim().toLowerCase();
      return n.includes('เฉพาะกิจ')?'hanoiTask':n.includes('พิเศษ')?'hanoiSpecial':(n.includes('vip')||n.includes('วีไอพี'))?'hanoiVip':(n===''||n.includes('ปกติ'))?'hanoi':null; };
    const bre=/ผลหวยฮานอย\s*([฀-๿a-zA-Z ]{0,14}?)\s*(?:เลข\s*4\s*ตัว\s*:?\s*\d{4}\s*)?เลข\s*3\s*ตัวบน\s*:?\s*(\d{3})\s*เลข\s*2\s*ตัวบน\s*:?\s*(\d{2})\s*เลข\s*2\s*ตัวล่าง\s*:?\s*(\d{2})(?!\d)/g;
    const out=kind==='lao'?{lao:[]}:{hanoi:[],hanoiSpecial:[],hanoiVip:[],hanoiTask:[]}; const seen={};
    for(const p of (Array.isArray(posts)?posts:[])){
      const title=strip(p.title&&p.title.rendered), body=strip(p.content&&p.content.rendered);
      const k0=title.indexOf('งวดประจำวัน'); if(k0<0) continue;
      const ts=this.findDate(title.slice(k0)); if(ts==null||isNaN(ts)) continue;   // หัวข่าวไม่มีวันที่ → ไม่เดา
      if(kind==='lao'){
        const m=body.match(/เลขท้าย\s*4\s*ตัว\s*:?\s*(\d{4})(?!\d)/); if(!m) continue;   // ยังไม่ออก = 'xxxx'
        const k='lao|'+this.ymd(ts); if(seen[k]) continue; seen[k]=1;
        out.lao.push({ ts, top:+m[1]%100, bottom:Math.floor(+m[1]/100) });
      } else {
        let m; bre.lastIndex=0;
        while((m=bre.exec(body))){
          const key=typeKey(m[1]); if(!key || m[2].slice(-2)!==m[3]) continue;   // 3 ตัวบนต้องลงท้ายด้วย 2 ตัวบน
          const k=key+'|'+this.ymd(ts); if(seen[k]) continue; seen[k]=1;
          out[key].push({ ts, top:+m[3], bottom:+m[4] });
        }
      }
    }
    return out;
  },
  async fetchLatest(kind){
    const q=encodeURIComponent(kind==='lao'?'ตรวจหวยลาววันนี้':'ตรวจหวยฮานอยวันนี้');
    // เซิร์ฟเวอร์บ้านกีฬาเก็บคำตอบไว้ 15 นาทีต่อ URL "พร้อม header CORS ของเว็บที่ขอคนแรก"
    // ถ้าเว็บอื่นขอ URL เดียวกันก่อน เบราว์เซอร์จะบล็อกเรา → ใส่ชื่อเว็บเรา + ช่วงเวลา 5 นาทีใน URL ให้ได้ cache ของตัวเอง
    // (ห้ามใส่ URL เต็มในพารามิเตอร์ — ไฟร์วอลล์ของเขาตอบ 403)
    const tag=(location.host||'file').replace(/[^a-z0-9]/gi,''), bucket=Math.floor(Date.now()/300000);
    const posts=await this.getJSON('https://www.bankeela.info/wp-json/wp/v2/posts?search='+q+'&per_page=10&_fields=title,content&o='+tag+'&t='+bucket);
    return this.parseBankeela(posts, kind);
  },
  async update(){
    if(this.updating) return;
    this._ensure();
    const id=this.state.lottery, kind=id==='lao'?'lao':'hanoi';
    this.updating=true; this.updateStatus=''; this.updateOk=null; render();
    const gotData=await this.reloadData(['', this.RAW_URL]);
    this._ensure();
    let added=0, latestOk=false;
    try{
      const res=await this.fetchLatest(kind); latestOk=true;
      for(const k in res){
        const have=new Set((this._seed[k]||[]).map(d=>this.ymd(d.ts)));
        const extra=res[k].filter(d=>!have.has(this.ymd(d.ts)));   // เติมเฉพาะวันที่ข้อมูลที่ตรวจแล้วยังไม่มี
        if(extra.length) this.mergeReal(extra,k);
        if(k===id) added=extra.length;
        this.lastUpd[k]=Date.now();
      }
      this.saveReal();
    }catch(e){}
    const all=this.draws(id), last=all[all.length-1];
    this.updateOk=gotData||latestOk;
    this.updateStatus=!this.updateOk ? 'ดึงไม่สำเร็จ — ตรวจการเชื่อมต่ออินเทอร์เน็ต แล้วกดใหม่อีกครั้ง'
      : 'อัปเดตแล้ว • ข้อมูลทั้งหมด '+all.length+' งวด (ล่าสุด '+this.thai(last.ts)+')'
        +(added?' • มี '+added+' งวดล่าสุดจากบ้านกีฬาที่ยังไม่ผ่านการตรวจเทียบ (ระบบจะยืนยันให้รอบกลางคืน)':'')
        +(!gotData?' • โหลดข้อมูลที่ตรวจแล้วชุดล่าสุดไม่ได้':'')
        +(!latestOk?' • ดึงงวดของวันนี้จากบ้านกีฬาไม่ได้':'');
    this.updating=false;
    // ช่วงวันที่แบบ "ทั้งหมด/6 เดือน/…" ต้องขยายให้ถึงงวดใหม่ด้วย ไม่งั้นงวดใหม่ถูกกรองทิ้ง
    if(['all','6m','3m','1m'].includes(this.state.preset)) this.applyPreset(this.state.preset); else render();
  },
};

  const tintBox=(label,val,fc)=>el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',padding:'8px 16px',borderRadius:'16px',background:fc.soft,color:fc.deep}},[

    el('span',{},'⚠️'),
    el('span',{html: real
      ? 'ตัวเลขคำนวณจาก<strong style="color:#6c6680">ผล'+l.name+'จริง</strong> '+total.toLocaleString()+' งวดในช่วงที่เลือก • ยิ่งงวดน้อย เปอร์เซ็นต์ยิ่งแกว่ง • ทดสอบย้อนหลังแล้ว การเลือกช่วงจากสถิติถูกพอๆ กับซื้อเลขชุดไหนก็ได้ • สถิติในอดีตไม่รับประกันผลในอนาคต โปรดเล่นอย่างมีสติ'
      : 'ขณะนี้เป็น<strong style="color:#6c6680">ข้อมูลตัวอย่าง</strong> กด “อัปเดตผลจริง” เพื่อดึงผล'+l.name+'จริง • สถิติในอดีตไม่รับประกันผลในอนาคต โปรดเล่นอย่างมีสติและพอประมาณ'}),
  ]));

  wrap.appendChild(detail);
}

/* ---- โหลดข้อมูลล่าสุดแบบข้าม cache ----
   ไฟล์ .js ด้านบนเป็นค่าตั้งต้น (ใช้ได้แม้เปิดจากไฟล์ file://)
   แต่เบราว์เซอร์มัก cache ไว้ ทำให้เห็นข้อมูลเก่าแม้ระบบอัปเดตทุกวันแล้ว
   จึงลองดึง .json สดมาทับก่อนเริ่ม (ถ้าดึงไม่ได้ ก็ใช้ค่าตั้งต้นเดิม) */
(async function boot(){
  await App.reloadData(['']);   // เปิดจากไฟล์ในเครื่อง (file://) โหลดไม่ได้ → ใช้ค่าจาก .js ด้านบนแทน
  App._ensure();
  App.applyPreset('all');  // ตั้งช่วงวันที่เริ่มต้นให้ตรงกับข้อมูลจริง แล้ว render
})();
</script>
